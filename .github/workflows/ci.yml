name: CI Pipeline - App Expo

on:
  push:
    branches: ['main', 'develop']
  pull_request:
    branches: ['main', 'develop']

jobs:
  lint-and-validate:
    name: Validar Código JS e Formatação
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --legacy-peer-deps

      - name: Checar vulnerabilidades conhecidas
        run: npm audit --audit-level=high

      - name: Escanear segredos e credenciais expostas
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checar formatação com Prettier
        run: npx prettier --check .

      - name: Executar Linter (ESLint)
        run: npm run lint

      - name: Executar Testes Automatizados e Cobertura
        run: npm test

      - name: Validar mensagem do último commit
        run: npx commitlint --from HEAD~1 --to HEAD --verbose

      - name: Checar compatibilidade do Expo
        run: npx expo-doctor
