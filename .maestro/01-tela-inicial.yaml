# Smoke test: o app abre e navega entre a tela inicial, o login e o cadastro
appId: host.exp.exponent
---
- runFlow: subflows/abrir-app.yaml
- assertVisible: 'FindPets'
- assertVisible: 'Escolha uma opção'
- tapOn:
    id: 'button-go-login'
- assertVisible: 'Entre com sua conta'
- tapOn: 'Voltar'
- assertVisible: 'Escolha uma opção'
- tapOn:
    id: 'button-go-register'
- assertVisible: 'Crie seus dados de acesso'
