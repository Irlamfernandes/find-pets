# Classes inválidas do login (caixa-preta): campos vazios, e-mail sem
# formato válido e conta inexistente / senha errada
appId: host.exp.exponent
---
- runFlow: subflows/abrir-app.yaml
- tapOn:
    id: 'button-go-login'
# Vazio
- tapOn:
    id: 'button-submit-auth'
- assertVisible: 'Preencha usuário e senha.'
# E-mail sem formato válido
- tapOn:
    id: 'input-email'
- inputText: 'semarroba.com'
- tapOn:
    id: 'input-password'
- inputText: 'senha123'
- hideKeyboard
- tapOn:
    id: 'button-submit-auth'
- assertVisible: 'Insira um formato de e-mail válido.'
# Conta que não existe no Firebase
- tapOn:
    id: 'input-email'
- eraseText: 30
- inputText: 'ninguem.e2e@teste.com'
- hideKeyboard
- tapOn:
    id: 'button-submit-auth'
- extendedWaitUntil:
    visible: 'Usuário não existe ou senha errada.'
    timeout: 30000
