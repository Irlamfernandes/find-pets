# Classe inválida do registro: o desaparecimento não é salvo sem foto
appId: host.exp.exponent
---
- runFlow: subflows/abrir-app.yaml
- runFlow: subflows/criar-conta.yaml
- tapOn:
    id: 'tab-report'
- assertVisible: 'Sobre o pet'
- scrollUntilVisible:
    element:
      id: 'button-submit-report'
    direction: DOWN
- tapOn:
    id: 'button-submit-report'
- assertVisible: 'Adicione uma foto'
- tapOn: 'Entendi'
- assertVisible: 'Sobre o pet'
