# Classe inválida do registro: o desaparecimento não é salvo sem foto
appId: host.exp.exponent
---
- runFlow: subflows/entrar.yaml
- tapOn:
    id: 'tab-report'
- assertVisible: 'Sobre o pet'
- scrollUntilVisible:
    element:
      id: 'button-submit-report'
    direction: DOWN
- tapOn:
    id: 'button-submit-report'
- assertVisible: 'Adicione uma foto'
- tapOn: 'Entendi'
# Continua no formulário (nada foi salvo)
- assertVisible:
    id: 'button-submit-report'
