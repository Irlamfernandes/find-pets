# Classes inválidas e valor limite ao completar o perfil: campos vazios e
# WhatsApp curto; depois, dados válidos entram no feed
appId: host.exp.exponent
---
- runFlow: subflows/abrir-app.yaml
- runFlow: subflows/cadastrar.yaml
# Vazio
- tapOn:
    id: 'button-complete'
- assertVisible: 'Preencha todos os campos.'
# WhatsApp curto demais
- tapOn:
    id: 'input-name'
- inputText: 'Teste E2E'
- tapOn:
    id: 'input-whatsapp'
- inputText: '119999'
- hideKeyboard
- tapOn:
    id: 'button-complete'
- assertVisible: 'Insira um número de WhatsApp válido com código do país e DDD.'
# Válido
- tapOn:
    id: 'input-whatsapp'
- eraseText: 30
- runFlow: subflows/completar-perfil.yaml
