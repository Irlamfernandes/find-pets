# Segurança e edição do perfil: a edição só é liberada com a senha certa;
# depois, o nome alterado aparece no feed
appId: host.exp.exponent
env:
  PASSWORD: senha123
---
- runFlow: subflows/entrar.yaml
- tapOn:
    id: 'tab-profile'
- tapOn:
    id: 'button-edit-profile'
# Senha vazia
- tapOn: 'Confirmar'
- assertVisible: 'Digite sua senha.'
# Senha errada
- tapOn:
    id: 'input-current-password'
- inputText: 'senhaerrada'
- tapOn: 'Confirmar'
- assertVisible: 'Senha incorreta. Tente novamente.'
# Senha certa libera a edição
- tapOn:
    id: 'input-current-password'
- eraseText: 30
- inputText: ${PASSWORD}
- tapOn: 'Confirmar'
- assertVisible:
    id: 'button-save-profile'
# Troca o nome e salva
- tapOn:
    id: 'input-profile-name'
- eraseText: 30
- inputText: 'Nome Editado'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'button-save-profile'
    direction: DOWN
- tapOn:
    id: 'button-save-profile'
- assertVisible: 'Perfil atualizado'
- tapOn: 'Entendi'
- assertVisible: 'Olá, Nome Editado'
