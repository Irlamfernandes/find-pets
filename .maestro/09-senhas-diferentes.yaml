# Classe inválida da troca de senha: a confirmação diferente da nova senha
# é avisada no campo e impede salvar
appId: host.exp.exponent
---
- runFlow: subflows/entrar.yaml
- runFlow: subflows/liberar-edicao.yaml
- scrollUntilVisible:
    element:
      id: 'input-new-password'
    direction: DOWN
- tapOn:
    id: 'input-new-password'
- inputText: 'novasenha1'
# A confirmação aparece depois de digitar a nova senha, embaixo do teclado
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'input-confirm-password'
    direction: DOWN
- tapOn:
    id: 'input-confirm-password'
- inputText: 'outrasenha2'
- hideKeyboard
- assertVisible: 'As senhas não conferem.'
- scrollUntilVisible:
    element:
      id: 'button-save-profile'
    direction: DOWN
- tapOn:
    id: 'button-save-profile'
- assertVisible: 'Senhas diferentes'
- assertVisible: 'A confirmação precisa ser igual à nova senha.'
