# Navegação do feed: alterna entre lista e mapa e reabre o guia de uso
appId: host.exp.exponent
---
- runFlow: subflows/entrar.yaml
- tapOn: 'Mapa'
- assertVisible:
    id: 'lost-pets-map'
- tapOn: 'Lista'
- assertNotVisible:
    id: 'lost-pets-map'
# Botão de ajuda reabre o guia
- tapOn: 'Como funciona o app'
- assertVisible: 'Como funciona o FindPets'
- tapOn:
    id: 'button-dismiss-guide'
- assertNotVisible: 'Como funciona o FindPets'
