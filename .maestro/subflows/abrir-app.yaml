# Abre o FindPets no Expo Go do zero: apaga os dados, libera as permissões
# (câmera, fotos, localização) e carrega o app pelo endereço do Metro
appId: host.exp.exponent
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- openLink: ${EXPO_URL}
# Espera o app carregar (ou o menu do Expo Go aparecer por cima dele)
- extendedWaitUntil:
    visible: 'SDK version.*|Escolha uma opção'
    timeout: 60000
- runFlow: fechar-menu-expo.yaml
- extendedWaitUntil:
    visible:
      id: 'button-go-login'
    timeout: 10000
- runFlow: mover-ferramentas.yaml
