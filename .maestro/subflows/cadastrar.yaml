# Cria uma conta nova no Firebase com e-mail único a cada execução
# (${output.email}). Termina na tela de completar o perfil.
appId: host.exp.exponent
env:
  PASSWORD: senha123
---
- evalScript: ${output.email = 'e2e' + Date.now() + '@teste.com'}
- tapOn:
    id: 'button-go-register'
- tapOn:
    id: 'input-email'
- eraseText: 50
- inputText: ${output.email}
- tapOn:
    id: 'input-password'
- eraseText: 50
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: 'button-submit-auth'
- extendedWaitUntil:
    visible: 'Conta criada'
    timeout: 30000
- tapOn: 'Entendi'
- assertVisible: 'Complete seu Perfil'
