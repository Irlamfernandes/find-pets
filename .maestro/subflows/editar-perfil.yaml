# Abre o Perfil e libera a edição com a senha atual (${SENHA}). Termina com
# o botão de salvar visível.
appId: host.exp.exponent
---
- tapOn:
    id: 'tab-profile'
- tapOn:
    id: 'button-edit-profile'
- tapOn:
    id: 'input-current-password'
- eraseText: 50
- inputText: ${SENHA}
- tapOn: 'Confirmar'
- assertVisible:
    id: 'button-save-profile'
