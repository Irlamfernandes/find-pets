appId: host.exp.exponent
---
- tapOn:
    id: 'button-go-login'
- tapOn:
    id: 'input-email'
    point: '95%,50%'
- eraseText: 50
- inputText: ${EMAIL}
- tapOn:
    id: 'input-password'
    point: '95%,50%'
- eraseText: 50
- inputText: ${SENHA}
- hideKeyboard
- tapOn:
    id: 'button-submit-auth'
- extendedWaitUntil:
    visible: 'Login realizado'
    timeout: 30000
- tapOn: 'Entendi'
- waitForAnimationToEnd
- runFlow:
    when:
      visible: 'Entre mais rápido'
    commands:
      - tapOn: 'Depois'
- assertVisible:
    id: 'tab-feed'
