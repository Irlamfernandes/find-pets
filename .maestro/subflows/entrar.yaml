# Entra pela tela de login com o e-mail e a senha informados (${EMAIL} e
# ${SENHA}) e termina no feed. Começa na tela inicial.
appId: host.exp.exponent
---
- tapOn:
    id: 'button-go-login'
- tapOn:
    id: 'input-email'
- eraseText: 50
- inputText: ${EMAIL}
- tapOn:
    id: 'input-password'
- eraseText: 50
- inputText: ${SENHA}
- hideKeyboard
- tapOn:
    id: 'button-submit-auth'
- extendedWaitUntil:
    visible: 'Login realizado'
    timeout: 30000
- tapOn: 'Entendi'
- assertVisible:
    id: 'tab-feed'
