# Caminho feliz: chega ao feed o mais rápido possível, sem apagar os dados.
# Reaproveita a conta do último teste (desbloqueia com a senha guardada no
# celular); se não houver conta, cria uma. Use nos fluxos que testam o que
# vem depois do login.
appId: host.exp.exponent
env:
  PASSWORD: senha123
---
- launchApp:
    permissions:
      all: allow
- openLink: ${EXPO_URL}
- tapOn:
    text: 'Continue'
    optional: true
- extendedWaitUntil:
    visible: '(Bem-vindo de volta|Escolha uma opção|Complete seu Perfil|Olá, .*)'
    timeout: 60000
- runFlow: mover-ferramentas.yaml
# Sessão salva: desbloqueia com a senha
- runFlow:
    when:
      visible:
        id: 'input-unlock-password'
    commands:
      - tapOn:
          id: 'input-unlock-password'
      - inputText: ${PASSWORD}
      - tapOn:
          id: 'button-unlock-password'
# Conta criada sem perfil (teste interrompido): completa o perfil
- runFlow:
    when:
      visible: 'Complete seu Perfil'
    file: completar-perfil.yaml
# Nenhuma conta neste celular: cria uma
- runFlow:
    when:
      visible:
        id: 'button-go-register'
    file: criar-conta.yaml
- tapOn:
    id: 'button-dismiss-guide'
    optional: true
- extendedWaitUntil:
    visible:
      id: 'tab-feed'
    timeout: 30000
