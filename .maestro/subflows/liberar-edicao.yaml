# Abre o Perfil e libera a edição confirmando a senha atual
appId: host.exp.exponent
env:
  PASSWORD: senha123
---
- tapOn:
    id: 'tab-profile'
- tapOn:
    id: 'button-edit-profile'
- tapOn:
    id: 'input-current-password'
- inputText: ${PASSWORD}
- tapOn: 'Confirmar'
- assertVisible:
    id: 'button-save-profile'
