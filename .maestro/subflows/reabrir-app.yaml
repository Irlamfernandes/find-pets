appId: host.exp.exponent
---
- stopApp
- launchApp:
    permissions:
      all: allow
- openLink: ${EXPO_URL}
- extendedWaitUntil:
    visible: 'SDK version.*|Escolha uma opção'
    timeout: 60000
- runFlow: fechar-menu-expo.yaml
- extendedWaitUntil:
    visible: 'Escolha uma opção'
    timeout: 10000
- runFlow: mover-ferramentas.yaml
