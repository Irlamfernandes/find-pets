appId: host.exp.exponent
---
- scrollUntilVisible:
    element:
      id: 'input-new-password'
    direction: DOWN
- tapOn:
    id: 'input-new-password'
    point: '95%,50%'
- inputText: ${NOVA}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'input-confirm-password'
    direction: DOWN
- tapOn:
    id: 'input-confirm-password'
    point: '95%,50%'
- inputText: ${NOVA}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'button-save-profile'
    direction: DOWN
- tapOn:
    id: 'button-save-profile'
- extendedWaitUntil:
    visible: 'Perfil atualizado'
    timeout: 30000
- tapOn: 'Entendi'
- assertVisible:
    id: 'tab-feed'
