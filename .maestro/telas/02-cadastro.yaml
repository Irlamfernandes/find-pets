# Cadastro. Começa na tela de cadastro e termina em "Complete seu Perfil".
# Verificação: classes inválidas (campos vazios, e-mail sem formato válido e
# senha com menos de 6 caracteres, recusada pelo Firebase).
appId: host.exp.exponent
---
- runFlow:
    when:
      true: "${VERIFICAR == 'true'}"
    commands:
      - tapOn:
          id: 'button-submit-auth'
      - assertVisible: 'Preencha usuário e senha.'
      - tapOn:
          id: 'input-email'
      - inputText: 'semarroba.com'
      - tapOn:
          id: 'input-password'
      - inputText: 'senha123'
      - hideKeyboard
      - tapOn:
          id: 'button-submit-auth'
      - assertVisible: 'Insira um formato de e-mail válido.'
      - tapOn:
          id: 'input-email'
      - eraseText: 50
      - inputText: ${EMAIL}
      - tapOn:
          id: 'input-password'
      - eraseText: 50
      - inputText: '12345'
      - hideKeyboard
      - tapOn:
          id: 'button-submit-auth'
      - extendedWaitUntil:
          visible: 'A senha precisa ter pelo menos 6 caracteres.'
          timeout: 30000

# Caminho feliz: cria a conta (e-mail único desta execução)
- tapOn:
    id: 'input-email'
- eraseText: 50
- inputText: ${EMAIL}
- tapOn:
    id: 'input-password'
- eraseText: 50
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: 'button-submit-auth'
- extendedWaitUntil:
    visible: 'Conta criada'
    timeout: 30000
- tapOn: 'Entendi'
- assertVisible: 'Complete seu Perfil'
