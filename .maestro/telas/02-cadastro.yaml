appId: host.exp.exponent
---
- runFlow:
    when:
      true: "${VERIFICAR == 'true'}"
    commands:
      - setAirplaneMode: enabled
      - tapOn:
          id: 'input-email'
      - inputText: ${EMAIL}
      - tapOn:
          id: 'input-password'
      - inputText: ${SENHA}
      - hideKeyboard
      - tapOn:
          id: 'button-submit-auth'
      - extendedWaitUntil:
          visible: '.*Conecte-se à internet para criar a conta.*'
          timeout: 30000
      - setAirplaneMode: disabled
      - tapOn:
          id: 'input-email'
      - eraseText: 50
      - tapOn:
          id: 'input-password'
      - eraseText: 50
      - hideKeyboard
      - tapOn:
          id: 'button-submit-auth'
      - assertVisible: 'Preencha usuário e senha.'
      - tapOn:
          id: 'input-email'
      - inputText: 'semarroba.com'
      - tapOn:
          id: 'input-password'
      - inputText: ${SENHA}
      - hideKeyboard
      - tapOn:
          id: 'button-submit-auth'
      - assertVisible: 'Insira um formato de e-mail válido.'
      - tapOn:
          id: 'input-email'
      - eraseText: 50
      - inputText: ${EMAIL}
      - tapOn:
          id: 'input-password'
      - eraseText: 50
      - inputText: '12345'
      - hideKeyboard
      - retry:
          maxRetries: 3
          commands:
            - tapOn:
                id: 'button-submit-auth'
            - extendedWaitUntil:
                visible: 'A senha precisa ter pelo menos 6 caracteres.'
                timeout: 15000

- tapOn:
    id: 'input-email'
- eraseText: 50
- inputText: ${EMAIL}
- tapOn:
    id: 'input-password'
- eraseText: 50
- inputText: ${SENHA}
- hideKeyboard
- tapOn:
    id: 'button-submit-auth'
- extendedWaitUntil:
    visible: 'Conta criada'
    timeout: 30000
- tapOn: 'Entendi'
- assertVisible: 'Complete seu Perfil'
