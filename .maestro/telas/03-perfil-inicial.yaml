appId: host.exp.exponent
---
- runFlow:
    when:
      true: "${VERIFICAR == 'true'}"
    commands:
      - tapOn:
          id: 'button-complete'
      - assertVisible: 'Preencha todos os campos.'
      - tapOn:
          id: 'input-name'
      - inputText: 'Teste E2E'
      - tapOn:
          id: 'input-whatsapp'
      - inputText: '119999'
      - hideKeyboard
      - tapOn:
          id: 'button-complete'
      - assertVisible: 'Insira um número de WhatsApp válido com código do país e DDD.'

- tapOn:
    id: 'input-name'
- eraseText: 50
- inputText: 'Teste E2E'
- tapOn:
    id: 'input-whatsapp'
- eraseText: 50
- inputText: '5511999999999'
- hideKeyboard
- tapOn:
    id: 'button-complete'
- waitForAnimationToEnd
- tapOn:
    text: 'Depois'
    optional: true
- runFlow:
    when:
      visible: 'Perfil completo'
    commands:
      - tapOn: 'Entendi'
- assertVisible: 'Olá, Teste E2E'
