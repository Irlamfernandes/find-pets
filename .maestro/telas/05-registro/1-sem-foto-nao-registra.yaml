appId: host.exp.exponent
---
- tapOn:
    id: 'tab-report'
- assertVisible: 'Sobre o pet'
- scrollUntilVisible:
    element:
      id: 'button-submit-report'
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
- tapOn:
    id: 'button-submit-report'
- assertVisible: 'Adicione uma foto'
- tapOn: 'Entendi'
- tapOn:
    id: 'button-back'
- assertVisible:
    id: 'tab-feed'
