appId: host.exp.exponent
---
- tapOn:
    id: 'tab-report'
- assertVisible: 'Sobre o pet'
- tapOn: 'Cachorro'
- scrollUntilVisible:
    element:
      id: 'input-pet-breed'
    direction: DOWN
    centerElement: true
- tapOn:
    id: 'input-pet-breed'
    point: '95%,50%'
- inputText: 'bull'
- extendedWaitUntil:
    visible: 'Sugestões de raça'
    timeout: 20000
- hideKeyboard
- tapOn: 'English Bulldog'
- assertVisible:
    id: 'input-pet-breed'
    text: 'English Bulldog'
- assertNotVisible: 'Sugestões de raça'
- tapOn:
    id: 'button-back'
- assertVisible:
    id: 'tab-feed'
