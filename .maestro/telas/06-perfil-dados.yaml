appId: host.exp.exponent
---
- runFlow:
    when:
      true: "${VERIFICAR == 'true'}"
    commands:
      - tapOn:
          id: 'tab-profile'
      - tapOn:
          id: 'button-edit-profile'
      - tapOn: 'Confirmar'
      - assertVisible: 'Digite sua senha.'
      - tapOn:
          id: 'input-current-password'
      - inputText: 'senhaerrada'
      - tapOn: 'Confirmar'
      - assertVisible: 'Senha incorreta. Tente novamente.'
      - tapOn:
          id: 'input-current-password'
      - eraseText: 50
      - inputText: ${SENHA}
      - tapOn: 'Confirmar'
      - assertVisible:
          id: 'button-save-profile'
      - tapOn:
          id: 'input-profile-name'
      - eraseText: 50
      - hideKeyboard
      - tapOn:
          id: 'button-save-profile'
      - assertVisible: 'Confira seus dados'
      - tapOn: 'Entendi'
      - tapOn:
          id: 'input-profile-name'
      - inputText: 'Nome Editado'
      - tapOn:
          id: 'input-profile-whatsapp'
      - eraseText: 50
      - inputText: '119999'
      - hideKeyboard
      - tapOn:
          id: 'button-save-profile'
      - assertVisible: 'WhatsApp inválido'
      - tapOn: 'Entendi'
      - tapOn:
          id: 'input-profile-whatsapp'
      - eraseText: 50
      - inputText: '5521988887777'
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: 'input-new-password'
          direction: DOWN
      - tapOn:
          id: 'input-new-password'
      - inputText: 'novasenha1'
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: 'input-confirm-password'
          direction: DOWN
      - tapOn:
          id: 'input-confirm-password'
      - inputText: 'outrasenha2'
      - hideKeyboard
      - assertVisible: 'As senhas não conferem.'
      - scrollUntilVisible:
          element:
            id: 'button-save-profile'
          direction: DOWN
      - tapOn:
          id: 'button-save-profile'
      - assertVisible: 'Senhas diferentes'
      - tapOn: 'Entendi'
      - tapOn:
          id: 'input-new-password'
      - eraseText: 50
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: 'button-save-profile'
          direction: DOWN
      - tapOn:
          id: 'button-save-profile'
      - assertVisible: 'Perfil atualizado'
      - tapOn: 'Entendi'
      - assertVisible: 'Olá, Nome Editado'

- tapOn:
    id: 'tab-profile'
- assertVisible: 'Meus dados'
