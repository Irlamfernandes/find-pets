# Dados do perfil. Começa no feed e termina no Perfil.
# Verificação: a edição só é liberada com a senha certa; ao salvar, nome
# vazio, WhatsApp inválido e senhas diferentes são recusados; nome e WhatsApp
# novos são salvos.
appId: host.exp.exponent
---
- runFlow:
    when:
      true: "${VERIFICAR == 'true'}"
    commands:
      - tapOn:
          id: 'tab-profile'
      - tapOn:
          id: 'button-edit-profile'
      # Senha vazia e errada
      - tapOn: 'Confirmar'
      - assertVisible: 'Digite sua senha.'
      - tapOn:
          id: 'input-current-password'
      - inputText: 'senhaerrada'
      - tapOn: 'Confirmar'
      - assertVisible: 'Senha incorreta. Tente novamente.'
      # Senha certa
      - tapOn:
          id: 'input-current-password'
      - eraseText: 50
      - inputText: ${SENHA}
      - tapOn: 'Confirmar'
      - assertVisible:
          id: 'button-save-profile'
      # Nome vazio
      - tapOn:
          id: 'input-profile-name'
      - eraseText: 50
      - hideKeyboard
      - tapOn:
          id: 'button-save-profile'
      - assertVisible: 'Confira seus dados'
      - tapOn: 'Entendi'
      # WhatsApp inválido
      - tapOn:
          id: 'input-profile-name'
      - inputText: 'Nome Editado'
      - tapOn:
          id: 'input-profile-whatsapp'
      - eraseText: 50
      - inputText: '119999'
      - hideKeyboard
      - tapOn:
          id: 'button-save-profile'
      - assertVisible: 'WhatsApp inválido'
      - tapOn: 'Entendi'
      - tapOn:
          id: 'input-profile-whatsapp'
      - eraseText: 50
      - inputText: '5521988887777'
      - hideKeyboard
      # Senhas diferentes
      - scrollUntilVisible:
          element:
            id: 'input-new-password'
          direction: DOWN
      - tapOn:
          id: 'input-new-password'
      - inputText: 'novasenha1'
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: 'input-confirm-password'
          direction: DOWN
      - tapOn:
          id: 'input-confirm-password'
      - inputText: 'outrasenha2'
      - hideKeyboard
      - assertVisible: 'As senhas não conferem.'
      - scrollUntilVisible:
          element:
            id: 'button-save-profile'
          direction: DOWN
      - tapOn:
          id: 'button-save-profile'
      - assertVisible: 'Senhas diferentes'
      - tapOn: 'Entendi'
      # Apagar a nova senha limpa também a confirmação; salva nome e WhatsApp
      - tapOn:
          id: 'input-new-password'
      - eraseText: 50
      - hideKeyboard
      - scrollUntilVisible:
          element:
            id: 'button-save-profile'
          direction: DOWN
      - tapOn:
          id: 'button-save-profile'
      - assertVisible: 'Perfil atualizado'
      - tapOn: 'Entendi'
      - assertVisible: 'Olá, Nome Editado'

# Caminho feliz: abre o Perfil
- tapOn:
    id: 'tab-profile'
- assertVisible: 'Meus dados'
