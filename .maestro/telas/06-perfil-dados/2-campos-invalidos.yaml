appId: host.exp.exponent
---
- runFlow: ../../subflows/editar-perfil.yaml
- assertVisible: 'Nome \*'
- assertVisible: 'WhatsApp \*'
- tapOn:
    id: 'input-profile-name'
    point: '95%,50%'
- eraseText: 50
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'button-save-profile'
    direction: DOWN
- tapOn:
    id: 'button-save-profile'
- assertVisible: 'Confira seus dados'
- tapOn: 'Entendi'
- tapOn:
    id: 'input-profile-name'
    point: '95%,50%'
- eraseText: 50
- inputText: 'Nome Editado'
- tapOn:
    id: 'input-profile-whatsapp'
    point: '95%,50%'
- eraseText: 50
- inputText: '119999'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'button-save-profile'
    direction: DOWN
- tapOn:
    id: 'button-save-profile'
- assertVisible: 'WhatsApp inválido'
- tapOn: 'Entendi'
- tapOn:
    id: 'input-profile-whatsapp'
    point: '95%,50%'
- eraseText: 50
- inputText: '5521988887777'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'input-new-password'
    direction: DOWN
- tapOn:
    id: 'input-new-password'
    point: '95%,50%'
- inputText: 'novasenha1'
- hideKeyboard
- scrollUntilVisible:
    element:
      id: 'input-confirm-password'
    direction: DOWN
- assertVisible: 'Confirmar nova senha \*'
- tapOn:
    id: 'input-confirm-password'
    point: '95%,50%'
- inputText: 'outrasenha2'
- hideKeyboard
- assertVisible: 'As senhas não conferem.'
- scrollUntilVisible:
    element:
      id: 'button-save-profile'
    direction: DOWN
- tapOn:
    id: 'button-save-profile'
- assertVisible: 'Senhas diferentes'
- tapOn: 'Entendi'
- tapOn: 'Cancelar'
- tapOn:
    id: 'tab-feed'
- assertVisible:
    id: 'tab-feed'
