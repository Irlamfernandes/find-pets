# Sem internet (Android: modo avião). Começa no Perfil e termina no feed.
# Verificação (recuperação): o app avisa que está sem internet, continua
# navegando e o aviso some quando a conexão volta.
appId: host.exp.exponent
---
- tapOn:
    id: 'tab-feed'

- runFlow:
    when:
      true: "${VERIFICAR == 'true'}"
    commands:
      - assertNotVisible: 'Você está sem internet.*'
      - setAirplaneMode: enabled
      - extendedWaitUntil:
          visible: 'Você está sem internet.*'
          timeout: 20000
      - tapOn:
          id: 'tab-profile'
      - assertVisible: 'Meus dados'
      - tapOn:
          id: 'tab-feed'
      - setAirplaneMode: disabled
      - extendedWaitUntil:
          notVisible: 'Você está sem internet.*'
          timeout: 30000

# Caminho feliz: segue no feed
- assertVisible:
    id: 'tab-feed'
