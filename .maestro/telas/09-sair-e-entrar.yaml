# Sair e entrar. Começa no feed e termina no feed (login recente).
# Verificação: e-mail já cadastrado não cria outra conta; no login, campos
# vazios, e-mail inválido e senha errada são recusados.
appId: host.exp.exponent
---
- tapOn:
    id: 'tab-profile'
- tapOn:
    id: 'button-logout'
- assertVisible: 'Escolha uma opção'

- runFlow:
    when:
      true: "${VERIFICAR == 'true'}"
    commands:
      # E-mail já cadastrado
      - tapOn:
          id: 'button-go-register'
      - tapOn:
          id: 'input-email'
      - eraseText: 50
      - inputText: ${EMAIL}
      - tapOn:
          id: 'input-password'
      - eraseText: 50
      - inputText: 'outrasenha'
      - hideKeyboard
      - tapOn:
          id: 'button-submit-auth'
      - extendedWaitUntil:
          visible: 'Este e-mail já está cadastrado. Faça login.'
          timeout: 30000
      - tapOn: 'Voltar'
      # Login: vazio, e-mail inválido e senha errada
      - tapOn:
          id: 'button-go-login'
      - tapOn:
          id: 'input-email'
      - eraseText: 50
      - tapOn:
          id: 'input-password'
      - eraseText: 50
      - hideKeyboard
      - tapOn:
          id: 'button-submit-auth'
      - assertVisible: 'Preencha usuário e senha.'
      - tapOn:
          id: 'input-email'
      - inputText: 'semarroba.com'
      - tapOn:
          id: 'input-password'
      - inputText: ${SENHA}
      - hideKeyboard
      - tapOn:
          id: 'button-submit-auth'
      - assertVisible: 'Insira um formato de e-mail válido.'
      - tapOn:
          id: 'input-email'
      - eraseText: 50
      - inputText: ${EMAIL}
      - tapOn:
          id: 'input-password'
      - eraseText: 50
      - inputText: 'senhaerrada'
      - hideKeyboard
      - tapOn:
          id: 'button-submit-auth'
      - extendedWaitUntil:
          visible: 'Usuário não existe ou senha errada.'
          timeout: 30000
      - tapOn: 'Voltar'

# Caminho feliz: entra com a senha certa
- runFlow: ../subflows/entrar.yaml
