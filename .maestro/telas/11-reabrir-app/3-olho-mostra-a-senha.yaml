appId: host.exp.exponent
---
- tapOn:
    id: 'button-go-login'
- tapOn:
    id: 'input-password'
    point: '95%,50%'
- inputText: 'segredo1'
- hideKeyboard
- assertNotVisible: 'segredo1'
- tapOn: 'Mostrar senha'
- assertVisible: 'segredo1'
- tapOn: 'Ocultar senha'
- assertNotVisible: 'segredo1'
- tapOn: 'Voltar'
- assertVisible: 'Escolha uma opção'
