appId: host.exp.exponent
---
- tapOn:
    id: 'tab-profile'
- tapOn:
    id: 'button-logout'
- setAirplaneMode: enabled
- runFlow: ../../subflows/entrar.yaml
- assertVisible: 'Você está sem internet.*'
- setAirplaneMode: disabled
- extendedWaitUntil:
    visible: 'Entre novamente'
    timeout: 60000
- tapOn: 'Entendi'
- assertVisible: 'Escolha uma opção'
- runFlow: ../../subflows/entrar.yaml
