# Análise do SonarQube (rode depois de "npm test" e do "pytest" na pasta api)
sonar.projectKey=FindPets
sonar.projectName=FindPets

# Código: app (src e App.js) e API (api/)
sonar.sources=src,App.js,api/app.py,api/findpets_api
sonar.tests=src,api/tests
sonar.test.inclusions=src/**/__tests__/**,api/tests/**
sonar.exclusions=src/**/__tests__/**,**/__pycache__/**

# Cobertura gerada pelo Jest e pelo pytest
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=api/coverage.xml
sonar.python.version=3.12

# Fora da cobertura (mesmas exceções do Jest e do pytest): pontos de entrada
# e utilitários de teste
sonar.coverage.exclusions=App.js,api/app.py,src/testing/**
